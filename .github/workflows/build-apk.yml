name: Build PDF WITH LOVE Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract App Version and Build Number
        id: version
        run: |
          VERSION_LINE=$(grep -E '^version:' openpdf_mobile/pubspec.yaml | awk '{print $2}')
          APP_VERSION=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "$APP_VERSION" ]; then
            BUILD_NUMBER="${{ github.run_number }}"
          fi
          RELEASE_TAG="v${APP_VERSION}-build.${BUILD_NUMBER}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${APP_VERSION} (build ${BUILD_NUMBER}) -> tag ${RELEASE_TAG}"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Ensure Android SDK Platform 35 is Installed
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Clean and Install Dependencies
        working-directory: openpdf_mobile
        run: |
          rm -f test/widget_test.dart
          flutter clean
          flutter pub get
          flutter analyze || true

      - name: Run Unit Verification Tests
        working-directory: openpdf_mobile
        run: flutter test test/unit/
        continue-on-error: true

      - name: Build Android Release APK (Universal & Split-ABI)
        working-directory: openpdf_mobile
        run: |
          # 1. Build Universal APK (Primary download — guaranteed to install on all Android devices)
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

          mkdir -p /tmp/universal_apk
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/universal_apk/PDF-WITH-LOVE-Release.apk

          # 2. Build Split-ABI APKs (Optional lightweight architecture-specific APKs)
          flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation || true

      - name: Verify Generated APK Integrity
        run: |
          if [ ! -s /tmp/universal_apk/PDF-WITH-LOVE-Release.apk ]; then
            echo "ERROR: Universal Release APK was not generated or is empty!"
            exit 1
          fi
          python3 -m zipfile -t /tmp/universal_apk/PDF-WITH-LOVE-Release.apk
          echo "Verified Universal APK:"
          ls -lh /tmp/universal_apk/PDF-WITH-LOVE-Release.apk

      - name: Prepare Release APK Distribution Files
        id: apks
        run: |
          mkdir -p output_apk
          cp /tmp/universal_apk/PDF-WITH-LOVE-Release.apk output_apk/PDF-WITH-LOVE-Release.apk

          if [ -f openpdf_mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp openpdf_mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_apk/PDF-WITH-LOVE-arm64-v8a.apk
          fi
          if [ -f openpdf_mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp openpdf_mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_apk/PDF-WITH-LOVE-armeabi-v7a.apk
          fi
          if [ -f openpdf_mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp openpdf_mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk output_apk/PDF-WITH-LOVE-x86_64.apk
          fi

          UNIVERSAL_SIZE=$(ls -lh output_apk/PDF-WITH-LOVE-Release.apk | awk '{print $5}')
          echo "universal_size=${UNIVERSAL_SIZE}" >> "$GITHUB_OUTPUT"
          echo "Prepared APK files:"
          ls -lh output_apk/

      - name: Upload Release APK as Workflow Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: PDF-WITH-LOVE-Release-APK
          path: output_apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "PDF WITH LOVE v${{ steps.version.outputs.app_version }} (Build ${{ steps.version.outputs.build_number }})"
          allowUpdates: true
          generate_release_notes: false
          draft: false
          prerelease: false
          body: |
            ## PDF WITH LOVE — Android Release v${{ steps.version.outputs.app_version }} (Build ${{ steps.version.outputs.build_number }})

            ### Direct APK Downloads
            - **[PDF-WITH-LOVE-Release.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/PDF-WITH-LOVE-Release.apk)** (${{ steps.apks.outputs.universal_size }}) — **Universal APK (Recommended for all Android phones)**
            - **[PDF-WITH-LOVE-arm64-v8a.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/PDF-WITH-LOVE-arm64-v8a.apk)** — Optimized 64-bit ARM APK
            - **[PDF-WITH-LOVE-armeabi-v7a.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/PDF-WITH-LOVE-armeabi-v7a.apk)** — 32-bit ARM APK

            **Always-Latest Direct URL:**
            `https://github.com/${{ github.repository }}/releases/latest/download/PDF-WITH-LOVE-Release.apk`
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
