name: Build PDF WITH LOVE Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract App Version, Build Number, and Release Eligibility
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_LINE=$(grep -E '^version:' openpdf_mobile/pubspec.yaml | awk '{print $2}')
          APP_VERSION=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "$APP_VERSION" ]; then
            echo "ERROR: pubspec.yaml must specify version+buildNumber (e.g. 2.0.1+11)"
            exit 1
          fi
          RELEASE_TAG="v${APP_VERSION}"
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Check if this release tag already exists so we never overwrite an existing release
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            SHOULD_PUBLISH="false"
            echo "Release ${RELEASE_TAG} already exists; skipping release overwrite."
          else
            SHOULD_PUBLISH="true"
            echo "New release tag ${RELEASE_TAG} will be created at commit ${GITHUB_SHA}."
          fi

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Version: ${APP_VERSION} | Build: ${BUILD_NUMBER} | Commit: ${GITHUB_SHA} | Time: ${BUILD_TIMESTAMP}"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Ensure Android SDK Platform 35 is Installed
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Clean Stale Outputs and Install Dependencies
        working-directory: openpdf_mobile
        run: |
          rm -rf build/ ../output_apk/ /tmp/universal_apk/ /tmp/verify_release/
          rm -f test/widget_test.dart
          flutter clean
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Run Flutter Unit Verification Tests
        working-directory: openpdf_mobile
        run: flutter test test/unit/

      - name: Set up Node.js for PDF Editing Regression Tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Mandatory PDF Text Editing Regression Tests
        run: |
          npm ci || npm install --no-save pdfjs-dist@3.11.174
          node --check js/pdf-content-stream-editor.js
          node --check js/text-editor.js
          node --check js/export-client.js
          node --check js/app.js
          node scripts/sync-editor-assets.mjs --check
          node tests/pdf-text-editing.test.mjs
          node tests/document-conversion.test.mjs

      - name: Build Fresh Android Release APKs (Universal & Split-ABI)
        working-directory: openpdf_mobile
        run: |
          DART_DEFINES="--dart-define=APP_VERSION=${{ steps.version.outputs.app_version }} --dart-define=APP_BUILD_NUMBER=${{ steps.version.outputs.build_number }} --dart-define=EDITOR_VERSION=5.0 --dart-define=GIT_COMMIT_SHA=${{ github.sha }} --dart-define=BUILD_TIMESTAMP=${{ steps.version.outputs.build_timestamp }}"

          # 1. Build Universal APK
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation $DART_DEFINES

          mkdir -p /tmp/universal_apk
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/universal_apk/PDF-Studio-Release.apk

          # 2. Build Split-ABI APKs
          flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation $DART_DEFINES

      - name: Verify APK Integrity, Version Metadata, Checksums & Freshness
        id: apks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output_apk
          cp /tmp/universal_apk/PDF-Studio-Release.apk output_apk/PDF-Studio-Release.apk
          cp openpdf_mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_apk/PDF-Studio-arm64.apk
          cp openpdf_mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_apk/PDF-Studio-arm32.apk

          for f in output_apk/*.apk; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is missing or empty!"
              exit 1
            fi
            python3 -m zipfile -t "$f"
          done

          # Verify actual versionCode, versionName, and package inside compiled Universal APK
          AAPT2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging output_apk/PDF-Studio-Release.apk | head -n 5)
            echo "$BADGING"
            echo "$BADGING" | grep -q "name='com.openpdf.studio'"
            echo "$BADGING" | grep -q "versionCode='${{ steps.version.outputs.build_number }}'"
            echo "$BADGING" | grep -q "versionName='${{ steps.version.outputs.app_version }}'"
          fi

          SHA_UNI=$(sha256sum output_apk/PDF-Studio-Release.apk | awk '{print $1}')
          SHA_ARM64=$(sha256sum output_apk/PDF-Studio-arm64.apk | awk '{print $1}')
          SHA_ARM32=$(sha256sum output_apk/PDF-Studio-arm32.apk | awk '{print $1}')

          # Compare against previous release Universal APK to guarantee a fresh build
          mkdir -p /tmp/prev_release
          if gh release download --repo "${{ github.repository }}" --pattern "PDF-Studio-Release.apk" --dir /tmp/prev_release --clobber 2>/dev/null; then
            PREV_SHA=$(sha256sum /tmp/prev_release/PDF-Studio-Release.apk | awk '{print $1}')
            echo "Previous Release SHA-256: ${PREV_SHA}"
            echo "New Build SHA-256:        ${SHA_UNI}"
            if [ "$SHA_UNI" = "$PREV_SHA" ] && [ "${{ steps.version.outputs.should_publish }}" = "true" ]; then
              echo "ERROR: Newly built APK is identical to previous release despite version bump!"
              exit 1
            fi
          fi

          SIZE_UNI=$(ls -lh output_apk/PDF-Studio-Release.apk | awk '{print $5}')
          SIZE_ARM64=$(ls -lh output_apk/PDF-Studio-arm64.apk | awk '{print $5}')
          SIZE_ARM32=$(ls -lh output_apk/PDF-Studio-arm32.apk | awk '{print $5}')

          echo "sha_uni=${SHA_UNI}" >> "$GITHUB_OUTPUT"
          echo "sha_arm64=${SHA_ARM64}" >> "$GITHUB_OUTPUT"
          echo "sha_arm32=${SHA_ARM32}" >> "$GITHUB_OUTPUT"
          echo "size_uni=${SIZE_UNI}" >> "$GITHUB_OUTPUT"
          echo "size_arm64=${SIZE_ARM64}" >> "$GITHUB_OUTPUT"
          echo "size_arm32=${SIZE_ARM32}" >> "$GITHUB_OUTPUT"

          ls -lh output_apk/
          sha256sum output_apk/*.apk

      - name: Upload Release APK as Workflow Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Release-APK-${{ steps.version.outputs.tag }}
          path: output_apk/*.apk
          retention-days: 30

      - name: Publish New GitHub Release
        if: steps.version.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "PDF 🫰 Studio ${{ steps.version.outputs.tag }} (Build ${{ steps.version.outputs.build_number }})"
          allowUpdates: false
          make_latest: true
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## PDF 🫰 Studio — Android Release ${{ steps.version.outputs.tag }} (Build ${{ steps.version.outputs.build_number }})

            - **Source Commit:** `${{ github.sha }}`
            - **Build Timestamp:** `${{ steps.version.outputs.build_timestamp }}`
            - **PDF Editor Engine:** `v5.0`

            ### Direct APK Downloads
            - **[PDF-Studio-Release.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/PDF-Studio-Release.apk)** (${{ steps.apks.outputs.size_uni }}) — **Universal APK** (Android 7.0+ / API 24+, supports `arm64-v8a`, `armeabi-v7a`, `x86_64`)
            - **[PDF-Studio-arm64.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/PDF-Studio-arm64.apk)** (${{ steps.apks.outputs.size_arm64 }}) — **64-bit ARM (`arm64-v8a`)**
            - **[PDF-Studio-arm32.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/PDF-Studio-arm32.apk)** (${{ steps.apks.outputs.size_arm32 }}) — **32-bit ARM (`armeabi-v7a`)**

            ### SHA-256 Checksums
            - `PDF-Studio-Release.apk`: `${{ steps.apks.outputs.sha_uni }}`
            - `PDF-Studio-arm64.apk`: `${{ steps.apks.outputs.sha_arm64 }}`
            - `PDF-Studio-arm32.apk`: `${{ steps.apks.outputs.sha_arm32 }}`

            **Always-Latest Direct Download URL:**
            `https://github.com/${{ github.repository }}/releases/latest/download/PDF-Studio-Release.apk`
          files: |
            output_apk/PDF-Studio-Release.apk
            output_apk/PDF-Studio-arm64.apk
            output_apk/PDF-Studio-arm32.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Published Release Assets and SHA-256 Checksums
        if: steps.version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          mkdir -p /tmp/verify_release
          for APK in PDF-Studio-Release.apk PDF-Studio-arm64.apk PDF-Studio-arm32.apk; do
            gh release download "$TAG" --repo "$REPO" --pattern "$APK" --dir /tmp/verify_release --clobber
            LOCAL_SHA=$(sha256sum "output_apk/${APK}" | awk '{print $1}')
            REMOTE_SHA=$(sha256sum "/tmp/verify_release/${APK}" | awk '{print $1}')
            echo "${APK}: local=${LOCAL_SHA} remote=${REMOTE_SHA}"
            if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
              echo "ERROR: SHA-256 mismatch for ${APK}!"
              exit 1
            fi
          done
