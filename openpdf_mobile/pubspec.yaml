name: openpdf_studio
description: "PDF WITH LOVE - Professional Android PDF & Document Utility Application by RS7 Private Limited"
publish_to: "none"
version: 2.0.3+13

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # PDF Manipulation & Creation (Pure Dart)
  syncfusion_flutter_pdf: ^25.2.7
  pdf: ^3.10.8
  printing: ^5.12.0

  # OpenXML & Compression Engines (Zero-dependency pure Dart ZIP & XML)
  archive: ^3.5.0
  xml: ^6.5.0
  csv: ^6.0.0

  # Image Processing & Scanner Simulation (Pure Dart)
  image: ^4.2.0

  # On-Device OCR & ML Kit Text Recognition for Camera/Scanned Receipts
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.0

  # File Management & Storage Access Framework
  path_provider: ^2.1.3
  file_picker: ^8.0.3
  share_plus: ^9.0.0
  path: ^1.9.0

  # Persistent Storage & Database
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3

  # UI, Icons, Typography & Liquid Glass Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # High-Fidelity Website PDF Editor Web Engine
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/web/
    - assets/web/css/
    - assets/web/js/
    - assets/web/vendor/pdfjs/
    - assets/web/vendor/pdf-lib/
